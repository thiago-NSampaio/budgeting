spring.application.name=budgeting

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen3.5:0.8b

# jwt
security.token.secret=AURA-FINANCE_@123#

# Logging Configuration
logging.level.org.springframework.ai=DEBUG
logging.level.dio.budgeting=DEBUG
logging.level.dio.budgeting.service.TranscriptionService=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.level.org.springframework.security=DEBUG
# Server Configuration
server.port=8080
server.servlet.context-path=/
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3307/transaction
spring.datasource.username=app
spring.datasource.password=app
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect



# Connection Timeout
server.tomcat.connection-timeout=600000

# HTTP Request Timeout (6 minutos - suficiente para Whisper rodar)
# Precisa ser maior que PROCESS_TIMEOUT_SECONDS do TranscriptionService
server.http2.enabled=true
